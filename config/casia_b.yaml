dataset: coco
model:
  name: GaitXplain
  in_channels: 3
  hidden_channels: 64
  num_classes: 10 
  num_layers: 3
  dropout: 0.5
  max_hop: 3
  dilation: 1

data:
  num_frames: 99
  num_nodes: 17
  root: data

training:
  output_root: output
  checkpoint: output/model.pth
  batch_size: 32
  learning_rate: 0.001
  epochs: 10 
  device: cpu
  num_workers: 4
  save_interval: 10
  num_subjects: 10

inference:
  output_root: output
  device: cpu
  checkpoint: output/model.pth
  output: output/result_inference.json
  split: test
  sample_index: 0
  num_subjects: 10 
